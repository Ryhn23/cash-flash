services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: next-cash:latest
    container_name: next-cash-app
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATA_DIR=/app/data
      - UPLOAD_DIR=/app/uploads
      - SESSION_SECRET=${SESSION_SECRET:-nextcash-production-secret-random-token-key}
    volumes:
      - nextcash-data:/app/data
      - nextcash-uploads:/app/uploads
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://localhost:3001/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  nextcash-data:
    driver: local
  nextcash-uploads:
    driver: local

